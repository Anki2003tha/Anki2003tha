name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Anki2003tha
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff2ca8&color_dots=%231a061f,%23451a4d,%237d1f68,%23c82e91,%23ff6dcc
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
